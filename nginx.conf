server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to turva-back, like the Vite dev proxy in vite.config.ts
    # Keep only one of the two /api/ blocks below uncommented.

    # --- DEV: turva-back running locally (docker compose up in turva-back, port 3000) ---
    # host.docker.internal = PC as seen from inside the container
    location /api/ {
        proxy_pass http://host.docker.internal:3000;
    }

    # --- PROD: turva-back on Rahti ---
    # location /api/ {
    #     proxy_pass https://turva-back-turva-back.2.rahtiapp.fi;
    #     proxy_set_header Host turva-back-turva-back.2.rahtiapp.fi;
    #     proxy_ssl_server_name on;
    # }

    # SPA fallback for react-router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
